<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>LearnCode — potwierdzono</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f4f7ff;
      background:
        radial-gradient(ellipse at 18% 12%, rgba(66, 117, 255, .22), transparent 38%),
        radial-gradient(ellipse at 82% 88%, rgba(45, 204, 165, .12), transparent 36%),
        #0b1020;
    }
    .card {
      width: min(100%, 460px);
      padding: 42px 30px 30px;
      text-align: center;
      border: 1px solid rgba(164, 190, 245, .16);
      border-radius: 26px;
      background: rgba(19, 29, 51, .78);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
      backdrop-filter: blur(18px);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 42px;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -.5px;
    }
    .logo {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      color: #071326;
      background: linear-gradient(135deg, #9bcaff, #648dff);
      font-weight: 900;
    }
    .check {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 25px;
      border-radius: 50%;
      color: #43dfaa;
      background: rgba(67, 223, 170, .11);
      border: 1px solid rgba(67, 223, 170, .25);
      box-shadow: 0 0 38px rgba(67, 223, 170, .12);
    }
    .check svg { width: 38px; height: 38px; }
    h1 {
      margin: 0;
      font-size: clamp(25px, 6vw, 31px);
      line-height: 1.2;
      letter-spacing: -.9px;
    }
    .bottom {
      margin: 43px 0 0;
      padding-top: 20px;
      border-top: 1px solid rgba(164, 190, 245, .12);
      color: #8f9db8;
      font-size: 12px;
    }
    @media (max-width: 420px) {
      .card { padding: 34px 22px 25px; }
      .brand { margin-bottom: 36px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="logo">L</span> LearnCode</div>

    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="m5 12.5 4.3 4.2L19.5 6.8"
          stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>Pomyślnie potwierdzono adres e-mail!</h1>

    <p class="bottom">Możesz wrócić do aplikacji.</p>
  </main>
</body>
</html>
